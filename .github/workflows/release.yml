name: Release

# Baut auf Tags (v*) vorgefertigte Binaries und veröffentlicht sie samt
# SHA256SUMS als GitHub-Release-Assets — die Grundlage für den Ein-Zeilen-Installer.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-amd64:
    name: Build (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Frontend bauen
        run: cd web && npm ci && npm run build:nocheck
      - name: PAM-Header
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - name: Binary bauen (amd64)
        run: CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o debian-admin-linux-amd64 ./cmd/debian-admin
      - uses: actions/upload-artifact@v4
        with:
          name: debian-admin-linux-amd64
          path: debian-admin-linux-amd64

  build-arm64:
    name: Build (arm64, best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Frontend bauen
        run: cd web && npm ci && npm run build:nocheck
      - name: Cross-Toolchain + libpam (arm64)
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's|^deb http|deb [arch=amd64] http|' /etc/apt/sources.list || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main universe" | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libpam0g-dev:arm64
      - name: Binary bauen (arm64)
        run: CGO_ENABLED=1 GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -trimpath -ldflags "-s -w" -o debian-admin-linux-arm64 ./cmd/debian-admin
      - uses: actions/upload-artifact@v4
        with:
          name: debian-admin-linux-arm64
          path: debian-admin-linux-arm64

  release:
    name: Veröffentlichen
    needs: [build-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Prüfsummen erzeugen
        run: cd dist && sha256sum debian-admin-linux-* > SHA256SUMS && cat SHA256SUMS
      - name: Release-Assets hochladen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/debian-admin-linux-*
            dist/SHA256SUMS
