# nucleus (KIS) — Produktions-Stack für Podman + podman-compose auf Debian.
#
# Gegenstück zur Docker-/Coolify-Variante in ../docker-compose.prod.yml.
# Unterschiede zur Docker-Variante:
#   - Auch die Fremd-Images kommen aus der eigenen Registry (Mirror) und
#     werden wie alles hier über NUCLEUS_TAG (Default: latest) referenziert.
#     Die Upstream-Version wird ausschließlich in den FROM-Zeilen der
#     mirror-*-Services der Root-docker-compose.yml gepinnt — deployt wird
#     immer der zuletzt gepushte Stand.
#   - kis-web publiziert seinen Port auf 127.0.0.1 — davor gehört ein
#     Reverse-Proxy mit TLS (siehe README.md).
#   - Alle persistenten Daten liegen als Bind-Mounts unter
#     ${NUCLEUS_DATA_DIR:-/nucleus/data}/<dienst> statt in benannten Volumes —
#     Verzeichnisse vor dem ersten Start anlegen (siehe README.md). Auf
#     SELinux-Hosts (RHEL & Co.) bräuchten die Mounts ein `:z`-Suffix; auf
#     Debian (AppArmor) nicht nötig.
#   - Keine deploy.resources-Limits (podman-compose ignoriert `deploy:`);
#     bei Bedarf pro Service via `mem_limit`/`cpus` nachrüsten.
#   - AppHost bekommt /dev/fuse + gelockerte seccomp/apparmor-Profile für
#     verschachteltes Podman (siehe apps/apphost/Dockerfile + README).
#
# ALLE Images kommen aus der eigenen Registry registry.clinic.tools/nucleus/*:
# die nucleus-eigenen (web, apphost) werden dort gebaut, die Fremd-Images als
# Mirror der gepinnten Upstream-Images dorthin gespiegelt:
#   postgres → nucleus/database, redis → nucleus/cache,
#   gitea → nucleus/git, medplum-server → nucleus/fhir-engine
# Beides passiert aus dem Repo-Root über die dortige docker-compose.yml
# (Profil "release"):
#   docker compose --profile release build
#   docker compose --profile release push kis-web apphost \
#       mirror-postgres mirror-redis mirror-gitea mirror-medplum
# Der Server braucht damit NUR Zugriff auf registry.clinic.tools (kein
# Docker Hub). Dieses Verzeichnis enthält bewusst KEINE Build-Definitionen —
# der Server baut nichts, sondern pullt nur:
#   sudo podman-compose pull && sudo podman-compose up -d
#
# Der AppStore (kis-store) wird in Kundeninstallationen NICHT mitdeployt —
# er läuft zentral. kis-web erreicht ihn über APP_STORE_URL und holt dort
# Lizenz-JWTs und App-Pakete ab.
#
# Ablage auf der Zielinstanz: diese Datei liegt als /nucleus/compose.yml,
# daneben die .env als /nucleus/.env (Vorlage: .env.example — kopieren und
# füllen); alle persistenten Daten liegen unter /nucleus/data. Sämtliche
# podman-compose-Aufrufe laufen aus /nucleus.

name: nucleus

services:
    kis-web:
        image: registry.clinic.tools/nucleus/web:${NUCLEUS_TAG:-latest}
        restart: always
        depends_on:
            medplum-server:
                condition: service_healthy
            # Bewusst nur service_started: kis-web bootet auch ohne AppHost/
            # Gitea (Reconnect/Retry eingebaut) — ältere podman-compose-
            # Versionen ignorieren die conditions ohnehin und starten nur
            # in Reihenfolge; restart: always fängt den Rest ab.
            gitea:
                condition: service_started
            apphost:
                condition: service_started
        ports:
            - "127.0.0.1:${WEB_HTTP_PORT:-3000}:3000"
        environment:
            NODE_ENV: production
            MEDPLUM_BASE_URL: http://medplum-server:8103/
            # PFLICHT: Schlüssel für Session-Cookie-Sealing + OIDC-Flow-State.
            # >= 32 Zeichen. Fehlt der Wert, bricht der Server in Prod den Boot ab.
            NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
            # MUSS dem Lizenz-Signier-Secret des ZENTRALEN AppStores entsprechen
            # (HS256, vom Store-Betreiber übernehmen), sonst lehnt das Web alle
            # gültig signierten Lizenz-JWTs ab und blockt sämtliche Writes.
            LICENSE_JWT_SECRET: ${LICENSE_JWT_SECRET}
            SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@clinic.tools}
            SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
            # Zentraler AppStore — läuft NICHT in der Kundeninstallation.
            NUXT_APP_STORE_URL: ${APP_STORE_URL:-https://kis-store.clinictools.dev}
            NUXT_PUBLIC_APP_STORE_URL: ${APP_STORE_URL:-https://kis-store.clinictools.dev}
            APPHOST_WS_URL: ${APPHOST_WS_URL:-ws://apphost:8080/ws/v1}
            APPHOST_INTERNAL_TOKEN: ${APPHOST_INTERNAL_TOKEN}
            GITEA_BASE_URL: http://gitea:3000
            GITEA_INTERNAL_URL: http://gitea:3000
            GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-nucleus-admin}
            GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
            GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-nucleus-admin@local}
            GITEA_ORG_NAME: ${GITEA_ORG_NAME:-nucleus}
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    'fetch("http://localhost:3000/api/health").then(r => { if (!r.ok) throw new Error(); }).catch(() => { process.exit(1); })',
                ]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 15s

    postgres:
        # Mirror von docker.io/library/postgres (Version-Pin: Root-Compose,
        # Service mirror-postgres)
        image: registry.clinic.tools/nucleus/database:${NUCLEUS_TAG:-latest}
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-medplum}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB:-medplum}
        command:
            - "postgres"
            - "-c"
            - "listen_addresses=*"
            - "-c"
            - "statement_timeout=60000"
            - "-c"
            - "default_transaction_isolation=REPEATABLE READ"
            - "-c"
            - "shared_preload_libraries=pg_stat_statements,auto_explain"
        volumes:
            - ${NUCLEUS_DATA_DIR:-/nucleus/data}/database:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medplum}"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        # Mirror von docker.io/library/redis (Version-Pin: Root-Compose,
        # Service mirror-redis)
        image: registry.clinic.tools/nucleus/cache:${NUCLEUS_TAG:-latest}
        restart: always
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - ${NUCLEUS_DATA_DIR:-/nucleus/data}/cache:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    medplum-server:
        # Mirror von docker.io/medplum/medplum-server (Version-Pin: Root-
        # Compose, Service mirror-medplum — Medplums eigenes Hub-`latest`
        # wandert mit jedem main-Push und wird deshalb bewusst NICHT
        # gespiegelt; unser Tag zeigt immer auf die zuletzt gespiegelte,
        # gepinnte Version).
        image: registry.clinic.tools/nucleus/fhir-engine:${NUCLEUS_TAG:-latest}
        restart: always
        # "env" = Konfigurationsquelle: Medplum liest die Config aus den
        # MEDPLUM_*-Umgebungsvariablen (nicht aus einer Datei).
        command: ["env"]
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        environment:
            MEDPLUM_PORT: 8103
            MEDPLUM_BASE_URL: ${MEDPLUM_SERVER_URL:-https://kis.example.de/api/}
            MEDPLUM_STORAGE_BASE_URL: ${MEDPLUM_STORAGE_URL:-https://kis.example.de/api/storage/}
            MEDPLUM_BINARY_STORAGE: "file:./binary/"
            MEDPLUM_DATABASE_HOST: postgres
            MEDPLUM_DATABASE_PORT: 5432
            MEDPLUM_DATABASE_DBNAME: ${POSTGRES_DB:-medplum}
            MEDPLUM_DATABASE_USERNAME: ${POSTGRES_USER:-medplum}
            MEDPLUM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
            MEDPLUM_REDIS_HOST: redis
            MEDPLUM_REDIS_PORT: 6379
            MEDPLUM_REDIS_PASSWORD: ${REDIS_PASSWORD}
            MEDPLUM_MAX_JSON_SIZE: 10mb
            MEDPLUM_MAX_BATCH_SIZE: 10mb
            # Explizite Origin-Whitelist statt Wildcard. Kommaseparierte Liste
            # ALLER Tenant-Domains (Tenant-Auflösung läuft über den Hostname).
            MEDPLUM_ALLOWED_ORIGINS: ${MEDPLUM_ALLOWED_ORIGINS:-https://kis.example.de}
            MEDPLUM_INTROSPECTION_ENABLED: ${MEDPLUM_INTROSPECTION_ENABLED:-false}
            # VM-Context-Bots führen Bot-Code in-process auf dem Medplum-Server
            # aus. Wenn keine Bots gebraucht werden, auf "false" setzen.
            MEDPLUM_VM_CONTEXT_BOTS_ENABLED: ${MEDPLUM_VM_CONTEXT_BOTS_ENABLED:-true}
            MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION: ${MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION:-vmcontext}
            MEDPLUM_SHUTDOWN_TIMEOUT_MILLISECONDS: 30000
            MEDPLUM_DEFAULT_SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@clinic.tools}
            MEDPLUM_DEFAULT_SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
            MEDPLUM_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-help@clinic.tools}
        volumes:
            - ${NUCLEUS_DATA_DIR:-/nucleus/data}/binary:/usr/src/medplum/packages/server/binary
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    'fetch("http://localhost:8103/healthcheck").then(r => r.json()).then(console.log).catch(() => { process.exit(1); })',
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

    gitea:
        # Mirror von docker.io/gitea/gitea (Version-Pin: Root-Compose,
        # Service mirror-gitea)
        image: registry.clinic.tools/nucleus/git:${NUCLEUS_TAG:-latest}
        restart: always
        environment:
            USER_UID: "1000"
            USER_GID: "1000"
            GITEA__database__DB_TYPE: sqlite3
            GITEA__database__PATH: /data/gitea/gitea.db
            GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://gitea:3000/}
            GITEA__server__HTTP_PORT: "3000"
            GITEA__server__DISABLE_SSH: "true"
            GITEA__service__DISABLE_REGISTRATION: "true"
            GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
            GITEA__security__INSTALL_LOCK: "true"
            GITEA__log__LEVEL: ${GITEA_LOG_LEVEL:-Warn}
            NUCLEUS_ADMIN_USER: ${GITEA_ADMIN_USER:-nucleus-admin}
            NUCLEUS_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
            NUCLEUS_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-nucleus-admin@local}
        expose:
            - "3000"
        volumes:
            - ${NUCLEUS_DATA_DIR:-/nucleus/data}/git:/data
        entrypoint:
            - /bin/sh
            - -c
            - |
                (
                  until wget -q --spider http://localhost:3000/api/healthz 2>/dev/null; do sleep 2; done
                  if [ -z "$$NUCLEUS_ADMIN_PASSWORD" ]; then
                    echo "[gitea-bootstrap] FEHLER: GITEA_ADMIN_PASSWORD ist leer. Bitte in .env setzen — Bootstrap wird übersprungen." >&2
                    exit 0
                  fi
                  if su-exec git gitea admin user list 2>/dev/null | awk 'NR>1 {print $$2}' | grep -qx "$$NUCLEUS_ADMIN_USER"; then
                    echo "[gitea-bootstrap] Admin '$$NUCLEUS_ADMIN_USER' existiert — synchronisiere Passwort."
                    su-exec git gitea admin user change-password \
                      --username "$$NUCLEUS_ADMIN_USER" \
                      --password "$$NUCLEUS_ADMIN_PASSWORD" \
                      --must-change-password=false || true
                  else
                    echo "[gitea-bootstrap] Lege Admin '$$NUCLEUS_ADMIN_USER' an."
                    su-exec git gitea admin user create --admin \
                      --username "$$NUCLEUS_ADMIN_USER" \
                      --password "$$NUCLEUS_ADMIN_PASSWORD" \
                      --email "$$NUCLEUS_ADMIN_EMAIL" \
                      --must-change-password=false
                  fi
                ) &
                exec /usr/bin/entrypoint /bin/s6-svscan /etc/s6
        healthcheck:
            test: ["CMD", "curl", "-sf", "http://localhost:3000/api/healthz"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    apphost:
        image: registry.clinic.tools/nucleus/apphost:${NUCLEUS_TAG:-latest}
        container_name: kis-apphost
        restart: always
        # Verschachteltes (rootless) Podman im Container braucht laut
        # apps/apphost/Dockerfile + README: CAP_SYS_ADMIN, /dev/fuse und
        # gelockerte seccomp-/apparmor-Profile. Falls App-Container trotzdem
        # nicht starten (podman-in-podman ist host-abhängig), ist
        # `privileged: true` der dokumentierte, gleichwertige Fallback
        # (siehe apps/apphost/README.md § Security Model).
        cap_add:
            - SYS_ADMIN
        devices:
            - /dev/fuse:/dev/fuse
        security_opt:
            - seccomp=unconfined
            - apparmor=unconfined
        environment:
            APPHOST_INTERNAL_TOKEN: ${APPHOST_INTERNAL_TOKEN}
            APPHOST_STORAGE_ROOT: /var/lib/apphost
            APPHOST_PORT_RANGE_START: ${APPHOST_PORT_RANGE_START:-10000}
            APPHOST_PORT_RANGE_END: ${APPHOST_PORT_RANGE_END:-10100}
            LOG_LEVEL: ${APPHOST_LOG_LEVEL:-info}
        expose:
            - "8080"
        ports:
            # An die Env-Vars gekoppelt (gleiche Quelle wie der AppHost-Runtime-
            # Range — beide MÜSSEN übereinstimmen). Nur an 127.0.0.1 binden —
            # App-Ports laufen hinter dem Reverse-Proxy und dürfen nicht direkt
            # von außen erreichbar sein.
            - "127.0.0.1:${APPHOST_PORT_RANGE_START:-10000}-${APPHOST_PORT_RANGE_END:-10100}:${APPHOST_PORT_RANGE_START:-10000}-${APPHOST_PORT_RANGE_END:-10100}"
        volumes:
            - ${NUCLEUS_DATA_DIR:-/nucleus/data}/apphost:/var/lib/apphost
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    'fetch("http://localhost:8080/api/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))',
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 30s
